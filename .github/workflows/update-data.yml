name: Update IBM MQ RDQM kmod data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Fetch latest IBM MQ RDQM kmod compatibility file
        run: |
          mkdir -p data
          curl -sSL --fail \
            -o data/ibm-mq-rdqm-kmods.json \
            https://public.dhe.ibm.com/ibmdl/export/pub/software/websphere/messaging/mqadv/ibm-mq-rdqm-kmods.json
          python3 -c "import json,sys; d=json.load(open('data/ibm-mq-rdqm-kmods.json')); assert 'kernelLevels' in d, 'unexpected file shape'; print(len(d['kernelLevels']), 'kernel entries found')"

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ibm-mq-rdqm-kmods.json
          if git diff --staged --quiet; then
            echo "No changes — IBM's file hasn't been updated."
          else
            git commit -m "chore: refresh IBM MQ RDQM kmod data ($(date -u +%Y-%m-%d))"
            git push
          fi
